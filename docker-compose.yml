version: '3.8'

services:
  # Database services
  catalogdb:
    image: postgres:latest
    
  basketdb:
    image: postgres:latest
  
  distributedcache:
    image: redis
  catalog-api:
    image: ${DOCKER_REGISTRY-}catalog-api
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile

  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile

  dicountgrpc:
    image: ${DOCKER_REGISTRY-}dicountgrpc
    build:
      context: .
      dockerfile: Services/Discount/DicountGrpc/Dockerfile

volumes:
  postgres_catalog:
  postgres_basket:

